<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22626c">
<meta name="description" content="論文・基礎知識・まとめ資料・勉強会資料と小テストをまとめた勉強用アプリ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="勉強部屋">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>自分の勉強部屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#f4f6f7; --surface:#ffffff; --sunk:#eaeef1; --ink:#17222c; --ink-2:#465460; --ink-3:#6c7986;
  --line:#d6dde3; --line-2:#e7ecef;
  --accent:#a8323f; --accent-soft:#f6e5e7;
  --teal:#2b6a6e; --teal-soft:#e0eeef;
  --amber:#875811; --amber-soft:#f6edd9;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --head:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#10161c; --surface:#18212a; --sunk:#131b22; --ink:#e5ebef; --ink-2:#b3bfc9; --ink-3:#8593a0;
    --line:#2b3742; --line-2:#212b35;
    --accent:#e0717d; --accent-soft:#3a2126; --teal:#71b6bb; --teal-soft:#1a2f32; --amber:#e1b262; --amber-soft:#33281a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#10161c; --surface:#18212a; --sunk:#131b22; --ink:#e5ebef; --ink-2:#b3bfc9; --ink-3:#8593a0;
  --line:#2b3742; --line-2:#212b35;
  --accent:#e0717d; --accent-soft:#3a2126; --teal:#71b6bb; --teal-soft:#1a2f32; --amber:#e1b262; --amber-soft:#33281a;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:0 72px}
.wrap{max-width:920px;margin:0 auto}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url(img/bg.jpg) center/cover no-repeat;mix-blend-mode:multiply;opacity:.6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{filter:invert(1);mix-blend-mode:screen;opacity:.2}}
:root[data-theme="dark"] body::before{filter:invert(1);mix-blend-mode:screen;opacity:.2}
header{padding-block:28px 10px;display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--head);font-size:clamp(26px,5vw,34px);line-height:1.3;margin:0}
.sub{color:var(--ink-2);font-size:14px;margin:0}
.counts{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.searchbar{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.qrow{display:flex;gap:8px;flex-wrap:wrap}
#q{flex:1 1 260px;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font:inherit;cursor:pointer}
.btn{padding:9px 16px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2);padding:6px 10px}
.btn.small{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--ink-3)}
.examples{display:flex;gap:6px;flex-wrap:wrap}
.ex{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px dashed var(--line);background:transparent;color:var(--ink-2)}
.ex:hover{border-color:var(--accent);color:var(--accent)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding-block:10px;margin-bottom:16px;background:var(--paper);border-bottom:1px solid var(--line)}
@media (max-width:620px){.tabs{grid-template-columns:repeat(4,1fr)}}
.tab{display:grid;gap:1px;justify-items:center;align-content:center;min-height:54px;padding:6px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit}
.tab .tl{font-size:15px;font-weight:700;white-space:nowrap}
.tab .ti{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1.5px solid var(--line);margin-bottom:2px}
.tab[aria-selected="true"] .ti{border-color:rgba(255,255,255,.9)}
.hero{position:relative;height:150px;border-radius:14px;overflow:hidden;margin:4px 0 14px;background:var(--surface)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,18,28,.78) 0%,rgba(10,18,28,.45) 45%,rgba(10,18,28,0) 80%)}
.hero .ht{position:absolute;left:18px;bottom:16px;right:18px;z-index:1;color:#fff}
.hero .ht b{display:block;font-size:22px;letter-spacing:.02em}
.hero .ht span{font-size:13px;opacity:.92}
@media (max-width:620px){.hero{height:112px}.hero .ht b{font-size:18px}.hero .ht span{font-size:12px}}
.tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab[aria-selected="true"] .n{color:rgba(255,255,255,.85)}
.anchor{scroll-margin-top:150px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-block:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:6px}
.card .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3{font-size:15.5px;margin:0;line-height:1.5;flex:1 1 300px}
.card h3 a{color:inherit;text-decoration:none}
.card h3 a:hover{color:var(--accent);text-decoration:underline}
.meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.finding{margin:0;color:var(--ink);max-width:72ch}
.dose{font-size:13px;background:var(--sunk);border-radius:6px;padding:6px 10px;color:var(--ink-2);white-space:pre-wrap}
.dose b{color:var(--teal);font-weight:500;margin-right:6px}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:11.5px;color:var(--ink-3);background:var(--sunk);padding:0 8px;border-radius:4px}
.lvl{font-family:var(--mono);font-size:11px;font-weight:500;padding:1px 7px;border-radius:4px;white-space:nowrap}
.lvl.A{background:var(--teal-soft);color:var(--teal)}
.lvl.B{background:var(--amber-soft);color:var(--amber)}
.lvl.C{background:var(--accent-soft);color:var(--accent)}
.design{font-size:12px;color:var(--ink-2);border:1px solid var(--line);padding:0 7px;border-radius:4px;white-space:nowrap}
.kind{font-size:12px;color:var(--accent);font-weight:500}
.rowacts{display:flex;gap:4px;justify-content:flex-end}
.linked{font-size:13px;color:var(--ink-2)}
.linked a{color:var(--teal)}

.ai{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:8px;padding:14px 16px;display:grid;gap:10px;margin-top:14px}
.ai h2{font-size:14px;margin:0;color:var(--teal);font-weight:700;display:flex;gap:8px;align-items:center}
.ai .answer{margin:0;white-space:pre-wrap;max-width:74ch}
.ai .gap{font-size:13px;color:var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:6px}
.reason{font-size:13.5px;color:var(--teal);margin:0}
.str{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.sec-h{font-size:13px;color:var(--ink-3);margin:18px 0 6px;font-weight:500;letter-spacing:.04em}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);background:var(--surface);border:1px dashed var(--line);border-radius:8px}
.notice{font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:6px;background:var(--sunk);margin-top:10px}
.dots::after{content:"…";animation:d 1.2s steps(3) infinite}
@keyframes d{0%{content:"."}33%{content:".."}66%{content:"..."}}
@media (prefers-reduced-motion:reduce){.dots::after{animation:none;content:"…"}}

.sheet{position:fixed;inset:0;background:rgba(10,15,20,.45);display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow-y:auto;z-index:20}
.sheet .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);padding:18px;display:grid;gap:12px;margin-top:env(safe-area-inset-top,0px)}
.sheet h2{margin:0;font-size:17px}
.f{display:grid;gap:4px}
.f label{font-size:12.5px;color:var(--ink-2);font-weight:500}
.f input,.f textarea,.f select{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.f textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.pick{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--paper);display:grid;gap:2px;font-size:13px}
.pick label{display:flex;gap:6px;align-items:flex-start;font-weight:400;color:var(--ink)}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.err{color:var(--accent);font-size:13px}
.topics{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.topic{font-size:14px;padding:6px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-weight:500}
.topic[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.topic .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
.facets{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.facet{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:start}
.facet .lab{font-size:12px;color:var(--ink-3);padding-top:3px}
@media (max-width:480px){.facet{grid-template-columns:1fr}}
.viewsw{display:flex;gap:4px}
.viewsw button{font-size:12.5px;padding:4px 10px;border-radius:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.viewsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:860px;font-size:13px;line-height:1.55}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line-2)}
.tbl th{font-size:11.5px;font-weight:500;color:var(--ink-3);background:var(--paper);white-space:nowrap;position:sticky;top:0}
.tbl tr:last-child td{border-bottom:none}
.tbl td.k{font-weight:700;white-space:nowrap}
.tbl td.k a{color:inherit}
.tbl td.m{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.params{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:11.5px;padding:0 8px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2)}
.pchip b{font-weight:500;color:var(--ink-3);margin-right:4px}
.checks{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:13.5px}
.checks label{display:flex;gap:5px;align-items:center;font-weight:400;color:var(--ink)}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:14px;display:grid;grid-template-rows:auto 1fr auto;max-height:min(78vh,760px)}
.chat-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.chat-h h2{margin:0;font-size:15px;flex:1}
.chat-h .hint{margin:0}
.msgs{overflow-y:auto;padding:14px;display:grid;gap:14px;align-content:start;min-height:120px}
.msg{display:grid;gap:8px;max-width:100%}
.msg.user{justify-self:end;max-width:min(560px,92%)}
.msg.user .bubble{background:var(--ink);color:var(--paper);border-radius:12px 12px 2px 12px;padding:9px 13px;white-space:pre-wrap}
.msg.bot .bubble{background:var(--sunk);border-radius:12px 12px 12px 2px;padding:11px 14px;white-space:pre-wrap;max-width:74ch}
.msg.bot .gap{font-size:13px;color:var(--amber);background:var(--amber-soft);padding:8px 12px;border-radius:6px;max-width:74ch}
.msg.err .bubble{background:var(--accent-soft);color:var(--accent)}
.cites{display:grid;gap:6px;max-width:74ch}
.cites .lab{font-size:12px;color:var(--ink-3)}
.cite{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.cite summary{list-style:none;cursor:pointer;padding:8px 12px;display:grid;gap:3px}
.cite summary::-webkit-details-marker{display:none}
.cite .ct{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;font-weight:700}
.cite .why{font-size:13px;color:var(--teal)}
.cite .body{padding:0 12px 10px;display:grid;gap:6px;font-size:13.5px}
.cite .body a{color:var(--teal)}
.chat-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);align-items:flex-end;flex-wrap:wrap}
#chatIn{flex:1 1 240px;min-width:0;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);resize:none;min-height:44px;max-height:160px}
#chatIn:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.typing{color:var(--ink-3);font-size:14px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.term>summary{list-style:none;cursor:pointer;padding:13px 16px;display:grid;gap:3px}
.term>summary::-webkit-details-marker{display:none}
.term>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.term .tt{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.term .tt h3{margin:0;font-size:16.5px;font-family:var(--head)}
.term .aka{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.term .cat{font-size:11.5px;color:var(--teal);background:var(--teal-soft);padding:0 8px;border-radius:4px;white-space:nowrap}
.term .one{color:var(--ink-2);font-size:14px;margin:0}
.term .chev{margin-left:auto;color:var(--ink-3);font-size:12px;transition:transform .15s}
.term[open] .chev{transform:rotate(180deg)}
.term .tbody{padding:0 16px 16px;display:grid;gap:12px;border-top:1px solid var(--line-2);padding-top:12px}
.term .sec h4{margin:0 0 2px;font-size:13.5px;color:var(--accent);font-weight:700}
.term .sec p{margin:0;max-width:70ch;white-space:pre-wrap}
.term .prac{background:var(--amber-soft);border-radius:6px;padding:10px 12px;max-width:72ch}
.term .prac b{display:block;font-size:12.5px;color:var(--amber);margin-bottom:2px}
.term .rel{font-size:13px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.term .rel a{color:var(--teal)}
.termlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.termlinks button{font-size:12.5px;padding:2px 10px;border-radius:999px;border:1px solid var(--teal);background:var(--teal-soft);color:var(--teal)}
@media (prefers-reduced-motion:reduce){.term .chev{transition:none}}
.figs{display:grid;gap:14px}
.dg{margin:0;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;padding:12px;display:grid;gap:8px}
.dg .scroll{overflow-x:auto}
.dg svg{display:block;width:100%;min-width:560px;height:auto;color:var(--ink)}
.dg figcaption{font-size:13px;color:var(--ink-2);max-width:72ch}
.dg figcaption b{color:var(--ink)}
.dg text{fill:currentColor;font-family:var(--body);font-size:12.5px}
.dg .ttl{font-weight:700;font-size:13px}
.dg .soft{fill:var(--line-2);stroke:var(--line);stroke-width:1}
.dg .cord{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
.dg .ln{stroke:currentColor;stroke-width:1.5;fill:none}
.dg .cap{fill:var(--surface);stroke:currentColor;stroke-width:1.5}
.dg .if{stroke:var(--ink-3);stroke-width:4;stroke-linecap:round;fill:none}
.dg .ia{stroke:var(--accent);stroke-width:2.2;fill:none}
.dg text.ia,.dg .iaf{fill:var(--accent);stroke:none}
.dg .ii{stroke:var(--teal);stroke-width:2.2;fill:none}
.dg text.ii{fill:var(--teal);stroke:none}
.dg .gm{stroke:var(--amber);stroke-width:2.2;fill:none}
.dg .gmw{stroke:var(--amber);stroke-width:6;stroke-linecap:round;fill:none}
.dg text.gm{fill:var(--amber);stroke:none}
.dg .mn{fill:var(--surface);stroke:currentColor;stroke-width:1.8}
.dg .dash{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4;fill:none}
.dg .muted{fill:var(--ink-3)}
.dg .ln-fill{fill:currentColor}
.quiz{display:grid;gap:14px}
.qhead h2{margin:0;font-family:var(--head);font-size:22px}
.qhead p{margin:4px 0 0}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.stage{display:grid;gap:4px;text-align:left;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.stage:hover:not(:disabled){border-color:var(--accent)}
.stage:disabled{opacity:.55;cursor:default;background:var(--sunk)}
.stage.done{border-color:var(--teal)}
.stage .snum{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.stage.done .snum{color:var(--teal)}
.stage:disabled .snum{color:var(--ink-3)}
.stage .sname{font-weight:700;font-size:15.5px}
.stage .sdesc{font-size:13px;color:var(--ink-2)}
.stage .sbest{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.qbar{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;flex-wrap:wrap}
.prog{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
.qcard h3{margin:0;font-size:17px;line-height:1.6}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;line-height:1.6}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .ol{font-family:var(--mono);font-weight:500;color:var(--ink-3);flex:none;width:1.2em}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.right .ol{color:var(--teal)}

<div class="wrap">

    <h1>自分の勉強部屋</h1>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const BASIC_CATS = ["疾患・症状","受容器","神経と反射","脳","感覚器官"];
  const state = { posts: null, comments: [], openComments: null, books: [], bookView: "rec", bookGenre: "all", notes: {}, noteTimes: {}, papers: [], materials: [], basics: [], summaries: [], bcat: null, openTerm: null, tab: "papers", tag: null, q: "", canEdit: false, dbReady: false, ai: null, editing: null,
    topic: "all", view: "cards", f: { contraction: null, intensityCat: null, freqCat: null } };
  const CONTRACTIONS = ["アイソメトリック","エキセントリック","コンセントリック","複合（求心＋遠心）","プライオメトリック","ストレッチ・モビライゼーション","その他"];
  const INTENSITY_CATS = ["高（≥70%MVC・重い負荷）","中〜低（<70%MVC）","自重・最大努力","痛み・耐性で調整","—"];
  const FREQ_CATS = ["毎日","週3〜4回","週2回","週1回","単回","—"];
  const TOPIC_ORDER = ["肩の疾患","腱","関節包","感覚・神経","ハムストリングス","FRS"];
  const topicOf = (x) => String(x.topic || "未分類");
  const arr = (v) => Array.isArray(v) ? v.map(String) : [];
  let db = null, sample = null;

  const DESIGNS = ["メタ分析","システマティックレビュー","RCT","コホート","横断研究","介入研究","レビュー","ガイドライン","症例","その他"];
  const LEVELS = { A: "A 強い", B: "B 中程度", C: "C 弱い・仮説" };
  const KINDS = ["勉強会資料","レポート","スライド","動画","配布資料","メモ"];
  const EXAMPLES = ["腱を硬くする強度と保持時間","腱トレの頻度はどれくらい？","関節包は回旋とエンドレンジどっち？","筋紡錘は何を感じている？","どんな声かけが動きを良くする？","ノルディックの頻度は？","再発防止に効くリハ"];

  const SYN = {
    "ハム": ["ハムストリングス","hamstring","大腿二頭筋","bflh"],
    "frs": ["frs","内部筋力","internal strength","fra"],
    "pails": ["pails","rails","pails/rails","mvic","伸張位"],
    "bioflow": ["bioflow","boflow","結合組織","white tissue"],
    "cars": ["cars","関節ワークスペース","ワークスペース"],
    "肉離れ": ["肉離れ","strain","損傷","hsi"],
    "ノルディック": ["nhe","nordic","ノルディック"],
    "予防": ["予防","prevention","リスク"],
    "再発": ["再発","reinjury","recurrence"],
    "復帰": ["復帰","rtp","return","リハ"],
    "リハ": ["リハ","rehabilitation","復帰"],
    "遠心": ["エキセントリック","eccentric","遠心"],
    "エキセントリック": ["エキセントリック","eccentric","遠心"],
    "アイソメ": ["アイソメトリック","isometric","等尺"],
    "アイソメトリック": ["アイソメトリック","isometric","等尺"],
    "コンセントリック": ["コンセントリック","concentric","求心"],
    "ストレッチ": ["ストレッチ","柔軟性","stretch"],
    "スプリント": ["スプリント","sprint","最大速度"],
    "筋束": ["筋束","fascicle"],
    "腱": ["腱","tendon","スティフネス","アキレス","膝蓋腱"],
    "関節包": ["関節包","capsule","靭帯","カプセル"],
    "カプセル": ["関節包","capsule"],
    "回旋": ["回旋","rotation","内旋","外旋"],
    "エンドレンジ": ["エンドレンジ","end range","最終域","可動域の終わり"],
    "最終域": ["エンドレンジ","最終域"],
    "頻度": ["頻度","週","毎日"],
    "強度": ["強度","mvc","rm"],
    "筋紡錘": ["筋紡錘","spindle","固有受容"],
    "ゴルジ": ["ゴルジ腱器官","golgi"],
    "脳": ["脳・運動制御","脳・運動学習","運動野","神経"],
    "感覚": ["感覚","固有受容","感覚統合","受容器"],
    "キュー": ["キューイング","外的焦点","指導法"],
    "意識": ["外的焦点","キューイング"],
    "バランス": ["バランス","感覚統合","前庭"],
    "五十肩": ["凍結肩","肩関節周囲炎","関節包"],
    "四十肩": ["凍結肩","肩関節周囲炎"],
    "凍結肩": ["凍結肩","肩関節周囲炎","frozen"],
    "インピンジ": ["インピンジメント","肩峰下","腱板"],
    "胸郭出口": ["胸郭出口症候群","tos","しびれ"],
    "しびれ": ["しびれ","胸郭出口症候群","神経"],
  };

  const norm = (s) => String(s || "").toLowerCase().normalize("NFKC");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const tagsOf = (x) => Array.isArray(x.tags) ? x.tags.map(String) : [];
  const safeUrl = (u) => /^https?:\/\//i.test(String(u || "")) ? String(u) : "";

  function hay(x, kind) {
    const h = hay0(x, kind);
    const n = state.notes[`${kind}:${x.id}`];
    if (n) h.hi += " " + norm(n);
    return h;
  }
  function hay0(x, kind) {
    if (kind === "papers") return {
      hi: norm([x.title, tagsOf(x).join(" "), x.topic].join(" ")),
      mid: norm([x.finding, x.dose, arr(x.contraction).join(" "), x.intensity, x.volume, x.frequency, x.duration].join(" ")),
      lo: norm([x.authors, x.journal, x.design, x.year].join(" ")),
    };
    if (kind === "summaries") return {
      hi: norm([x.title, tagsOf(x).join(" "), x.topic].join(" ")),
      mid: norm([x.lead, ...(Array.isArray(x.sections) ? x.sections.map((s) => `${s.h} ${s.b}`) : [])].join(" ")),
      lo: norm([x.date].join(" ")),
    };
    if (kind === "basics") return {
      hi: norm([x.title, x.aka, tagsOf(x).join(" ")].join(" ")),
      mid: norm([x.summary, x.practice, ...(Array.isArray(x.sections) ? x.sections.map((s) => `${s.h} ${s.b}`) : [])].join(" ")),
      lo: norm([x.category, x.topic].join(" ")),
    };
    return { hi: norm([x.title, tagsOf(x).join(" ")].join(" ")), mid: norm([x.summary, x.topic].join(" ")), lo: norm([x.kind, x.date, x.fileName].join(" ")) };
  }
  function expand(q) {
    const terms = norm(q).split(/[\s、。,，?？!！・/]+/).filter(Boolean);
    const out = new Set();
    for (const t of terms) {
      out.add(t);
      for (const [k, list] of Object.entries(SYN)) if (t.includes(norm(k))) list.forEach((w) => out.add(norm(w)));
    }
    return [...out];
  }
  function bigrams(s) { const r = []; for (let i = 0; i < s.length - 1; i++) r.push(s.slice(i, i + 2)); return r; }
  function score(x, kind, terms) {
    const h = hay(x, kind); let s = 0;
    for (const t of terms) {
      if (h.hi.includes(t)) s += 6; else if (h.mid.includes(t)) s += 3; else if (h.lo.includes(t)) s += 1;
      else if (t.length >= 3) {
        const bg = bigrams(t); let hit = 0;
        for (const b of bg) if (h.hi.includes(b) || h.mid.includes(b)) hit++;
        if (bg.length && hit / bg.length >= 0.5) s += 2 * hit / bg.length;
      }
    }
    return s;
  }

  function base(kind) {
    let items = state[kind].slice();
    if (state.topic !== "all") items = items.filter((x) => topicOf(x) === state.topic);
    return items;
  }
  function sorted(kind) {
    let items = base(kind);
    if (kind === "papers") {
      const f = state.f;
      if (f.contraction) items = items.filter((x) => arr(x.contraction).includes(f.contraction));
      if (f.intensityCat) items = items.filter((x) => x.intensityCat === f.intensityCat);
      if (f.freqCat) items = items.filter((x) => x.freqCat === f.freqCat);
    }
    if (kind === "basics" && state.bcat) items = items.filter((x) => x.category === state.bcat);
    if (state.tag) items = items.filter((x) => tagsOf(x).includes(state.tag));

  async function sendChat(text) {
    text = String(text || "").trim();
    if (!text || !sample || chatBusy) return;
    $("#chat").hidden = false;
    const papers = scopePapers();
    if (!papers.length && !scopeBasics().length) { chat.push({ role: "user", text }, { role: "assistant", error: true, text: "このテーマにはまだ論文がありません。" }); renderChat(); return; }
    const history = chat.filter((m) => !m.error).slice(-8).map((m) => m.role === "user"
      ? { role: "user", content: m.text }
      : { role: "assistant", content: m.text + (m.picks?.length ? `\n（根拠：${m.picks.map((p) => p.id).join(", ")}）` : "") });
    chat.push({ role: "user", text });
    chatBusy = true; renderChat();
    chatCtl = new AbortController();
    const turns = [{ role: "user", content: chatRules(papers) }, ...history, { role: "user", content: text }];
    try {
      const r = await sample.json(turns, { signal: chatCtl.signal, cache: false });
      const ids = new Set(state.papers.map((p) => p.id));
      const picks = Array.isArray(r?.picks) ? r.picks.filter((x) => x && ids.has(String(x.id))).slice(0, 6).map((x) => ({ id: String(x.id), reason: String(x.reason || "") })) : [];
      const bids = new Set(state.basics.map((b) => b.id));
      const terms = Array.isArray(r?.terms) ? r.terms.map(String).filter((x) => bids.has(x)).slice(0, 4) : [];
      chat.push({ role: "assistant", text: String(r?.answer || "（答えが空でした）"), picks, terms, gaps: String(r?.gaps || "") });
    } catch (e) {
      const code = e?.code;
      if (code === "cancelled") chat.pop();
      else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) chat.push({ role: "assistant", error: true, text: "このページではチャットが使えません。キーワード検索は使えます。" });
      else if (code === "rate_limited") chat.push({ role: "assistant", error: true, text: "少し時間をおいてから、もう一度送ってください。" });
      else if (code === "prompt_too_large") chat.push({ role: "assistant", error: true, text: "書庫が大きくなりすぎました。上のテーマを選んで範囲を絞ってから聞いてください。" });
      else if (code === "invalid_json") chat.push({ role: "assistant", error: true, text: "答えの形が崩れました。もう一度送ると聞き直します。" });
      else chat.push({ role: "assistant", error: true, text: "通信がうまくいきませんでした。もう一度送ってください。" });
    } finally {
      chatBusy = false; saveChat(); renderChat();
    }
  }

  async function saveChatToSummary(mi, btn) {
    const m = chat[mi]; if (!m || m.role !== "assistant" || m.error || !db) return;
    let q = ""; for (let k = mi - 1; k >= 0; k--) if (chat[k].role === "user") { q = chat[k].text; break; }
    const body = { title: (q || "チャットのまとめ").slice(0, 60), date: new Date().toISOString().slice(0, 10), topic: state.topic === "all" ? "" : state.topic,
      lead: "", sections: [{ h: "質問", b: q }, { h: "答え", b: m.text }, ...(m.gaps ? [{ h: "書庫だけでは言えないこと", b: m.gaps }] : [])],
      url: "", tags: ["チャット"], terms: arr(m.terms), papers: (m.picks || []).map((p) => p.id), addedAt: new Date().toISOString() };
    btn.disabled = true; btn.textContent = "保存中…";
    try { await db.collection("summaries").doc(slug(body.title)).set(body); m.saved = true; saveChat(); renderChat(); }
    catch { btn.disabled = false; btn.textContent = "保存できませんでした。もう一度押してください"; }
  }

      if (!/^■/m.test(raw)) { if (raw.trim()) out.push({ h: "", b: raw.trim() }); return out; }
      const head = raw.split(/^■/m); if (head[0].trim()) out.push({ h: "", b: head[0].trim() });
      for (const chunk of head.slice(1)) { const c = chunk.trim(); if (!c) continue; const nl = c.indexOf("\n"); out.push(nl < 0 ? { h: c, b: "" } : { h: c.slice(0, nl).trim(), b: c.slice(nl + 1).trim() }); }

      <div class="err" id="beErr"></div>
      <div class="acts">${!d._new ? `<button type="button" class="btn danger" id="beDel">削除</button>` : ""}<span style="flex:1"></span>
        ${preview ? "" : `<button type="button" class="btn" id="bePrev">見た目を確認</button>`}<button type="button" class="btn" id="beCancel">やめる</button><button type="button" class="btn primary" id="beSave">保存</button></div>
    </div>`;
  }
  function syncDraft() {
    if (!$("#beTitle")) return;
    draft.title = $("#beTitle").value.trim(); draft.body = $("#beBody").value;
    draft.tags = splitTags($("#beTags").value); draft.published = $("#bePub").checked;
    document.querySelectorAll("#blogEd [data-cap]").forEach((i) => { draft.images[Number(i.dataset.cap)].caption = i.value; });
  }
  function insertAtCursor(text, block) {
    const ta = $("#beBody"); if (!ta) return;
    let a = draft._pos ?? ta.value.length; if (a > ta.value.length) a = ta.value.length;
    if (block) { const before = ta.value.slice(0, a), after = ta.value.slice(a);
      text = (before && !before.endsWith("\n\n") ? (before.endsWith("\n") ? "\n" : "\n\n") : "") + text + (after && !after.startsWith("\n") ? "\n\n" : ""); }
    ta.value = ta.value.slice(0, a) + text + ta.value.slice(a); ta.focus(); ta.selectionStart = ta.selectionEnd = draft._pos = a + text.length;
  }
  ["keyup", "click", "input", "select"].forEach((ev) => document.addEventListener(ev, (e) => { if (e.target.id === "beBody" && draft) draft._pos = e.target.selectionStart; }));
  function closeEditor() { draft = null; $("#blogEd").hidden = true; document.body.style.overflow = ""; }
  function refPicker(qstr) {
    const q = norm(qstr || "");
    const pool = [...state.papers.map((x) => ({ kind: "papers", x })), ...state.basics.map((x) => ({ kind: "basics", x })), ...state.summaries.map((x) => ({ kind: "summaries", x }))]
      .filter(({ x }) => !q || norm([x.title, x.authors, (x.tags || []).join(" "), x.topic].join(" ")).includes(q)).slice(0, 15);
    return pool.map(({ kind, x }) => `<button type="button" class="bpick" data-pick="${kind}:${esc(x.id)}"><span class="kind">${{ papers: "論文", basics: "基礎知識", summaries: "まとめ" }[kind]}</span>${esc(x.title)}</button>`).join("") || `<p class="hint">見つかりません。</p>`;
  }
  document.addEventListener("input", (e) => { if (e.target.id === "beRefQ") $("#beRefList").innerHTML = refPicker(e.target.value); });
  document.addEventListener("change", async (e) => {
    if (e.target.id !== "beCoverIn" && e.target.id !== "beImgIn") return;
    const f = e.target.files?.[0]; e.target.value = ""; if (!f) return;
    syncDraft(); $("#beErr").textContent = "写真を送っています…";
    try {
      const url = await window.studyBlog.uploadImage(f);
      if (e.target.id === "beCoverIn") draft.cover = url;
      else { draft.images.push({ url, caption: "" }); renderEditor(); insertAtCursor(`【写真${draft.images.length}】`, true); syncDraft(); return; }
      renderEditor();
    } catch { $("#beErr").textContent = "写真を送れませんでした。もう一度試してください。"; }
  });
  document.addEventListener("click", async (e) => {
    if (e.target.closest("#blogNew")) { openEditor(null); return; }
    const be = e.target.closest("[data-bed]"); if (be) { openEditor(state.posts.find((p) => p.id === be.dataset.bed)); return; }
    const bc = e.target.closest("[data-bcm]"); if (bc) { state.openComments = state.openComments === bc.dataset.bcm ? null : bc.dataset.bcm; render(); return; }
    const ok = e.target.closest("[data-bcok]"); if (ok) { await window.studyBlog.approve(Number(ok.dataset.bcok), ok.dataset.v === "1").catch(() => {}); loadBlog(); return; }
    const cd = e.target.closest("[data-bcdel]"); if (cd) { if (cd.dataset.sure !== "1") { cd.dataset.sure = "1"; cd.textContent = "本当に削除"; return; } await window.studyBlog.delComment(Number(cd.dataset.bcdel)).catch(() => {}); loadBlog(); return; }
    if (!e.target.closest("#blogEd")) return;
    const id = e.target.closest("button")?.id;
    if (id === "beH") { insertAtCursor("\n■ "); return; }
    if (id === "beImg") { $("#beImgIn").click(); return; }
    if (id === "beCoverBtn") { $("#beCoverIn").click(); return; }
    if (id === "beCoverDel") { syncDraft(); draft.cover = ""; renderEditor(); return; }
    if (id === "beRef") { const b = $("#beRefBox"); b.innerHTML = b.innerHTML ? "" : `<div class="bpicker"><input id="beRefQ" placeholder="論文・基礎知識を検索"><div id="beRefList">${refPicker("")}</div></div>`; $("#beRefQ")?.focus(); return; }
    const pk = e.target.closest("[data-pick]");
    if (pk) {
      const [kind, pid] = splitKey(pk.dataset.pick); const x = (state[kind] || []).find((y) => y.id === pid); if (!x) return;
      const snap = kind === "papers" ? { kind, id: pid, title: x.title, meta: [x.authors, x.year, x.journal].filter(Boolean).join(" · "), url: x.url || "", text: String(x.finding || "").slice(0, 160) }
        : { kind, id: pid, title: x.title, meta: kind === "basics" ? "基礎知識" : "まとめ", url: "", text: String(x.summary || x.lead || "").slice(0, 160) };
      draft.refs.push(snap); insertAtCursor(`【参考${draft.refs.length}】`, true); syncDraft(); renderEditor(); return;
    }
    const imd = e.target.closest("[data-imdel]"); if (imd) { syncDraft(); const i = Number(imd.dataset.imdel); draft.images.splice(i, 1); draft.body = renumber(draft.body, "写真", i); renderEditor(); return; }
    const rfd = e.target.closest("[data-refdel]"); if (rfd) { syncDraft(); const i = Number(rfd.dataset.refdel); draft.refs.splice(i, 1); draft.body = renumber(draft.body, "参考", i); renderEditor(); return; }
    if (id === "bePrev") { syncDraft(); renderEditor(true); return; }
    if (id === "bePrevOff") { renderEditor(); return; }
    if (id === "beCancel") { closeEditor(); return; }
    if (id === "beDel") { const b = e.target.closest("button"); if (b.dataset.sure !== "1") { b.dataset.sure = "1"; b.textContent = "本当に削除する"; return; }
      try { await window.studyBlog.remove(draft.id); closeEditor(); loadBlog(); } catch { $("#beErr").textContent = "削除できませんでした。"; } return; }
    if (id === "beSave") {
      if ($("#beTitle")) syncDraft();
      if (!draft.title) { $("#beErr").textContent = "タイトルを入れてください。"; return; }
      const { _new, _pos, ...post } = draft;
      if (post.published && !post.published_at) post.published_at = new Date().toISOString();
      const b = e.target.closest("button"); b.disabled = true;
      try { await window.studyBlog.save(post); closeEditor(); loadBlog(); }
      catch { $("#beErr").textContent = "保存できませんでした。もう一度試してください。"; b.disabled = false; }
    }
  });
  // 【写真3】を消したら、後ろの番号を1つずつ詰める
  function renumber(body, k, removed) {
    return String(body).replace(new RegExp(`【${k}([0-9０-９]+)】\\n?`, "g"), (m, d) => {
      const n = Number(String(d).replace(/[０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))) - 1;
      if (n === removed) return ""; return n > removed ? m.replace(/[0-9０-９]+/, String(n)) : m;
    });
  }
  $("#tab-blog").addEventListener("click", () => { state.tab = "blog"; state.tag = null; if (state.posts == null) loadBlog(); render(); });
  // 本タブ
  $("#tab-books").addEventListener("click", () => { state.tab = "books"; state.tag = null; render(); });
  $("#list").addEventListener("click", async (e) => {
    if (state.tab !== "books") return;
    const v = e.target.closest("[data-bview]"); if (v) { state.bookView = v.dataset.bview; state.bookGenre = "all"; render(); return; }
    const g = e.target.closest("[data-bgenre]"); if (g) { state.bookGenre = g.dataset.bgenre; render(); return; }
    const mv = e.target.closest("[data-bmove]");
    if (mv && db) {
      const b = state.books.find((x) => x.id === mv.dataset.bmove); if (!b) return;
      const { id, ...rest } = b; mv.disabled = true;
      try { await db.collection("books").doc(id).set({ ...rest, status: "おすすめ" }); } catch { mv.disabled = false; }
    }
  });
  // メモタブ
  $("#tab-memo").addEventListener("click", () => { state.tab = "memo"; state.tag = null; render(); });
  $("#list").addEventListener("click", (e) => {
    if (e.target.closest("#memoNew")) {
      const id = "m" + Date.now().toString(36);
      $("#memoNewBox").innerHTML = `<article class="card memo">${noteBlock("free", id)}</article>`;
      $("#memoNewBox [data-note-edit]").click();
      return;
    }
    const go = e.target.closest("[data-memo-go]");
    if (go) {
      const [kind, id] = splitKey(go.dataset.memoGo);
      const item = (state[kind] || []).find((x) => x.id === id); if (!item) return;
      if (kind === "basics") { goTerm(id); return; }
      if (kind === "books") { state.tab = "books"; state.bookView = (item.status || "おすすめ") === "読みたい" ? "want" : "rec"; state.bookGenre = "all"; state.q = item.title; $("#q").value = item.title; render(); return; }
      state.tab = kind; state.tag = null; state.q = item.title; $("#q").value = item.title; render();
    }
  });
  // 自分のメモ
  $("#list").addEventListener("click", async (e) => {
    const ed = e.target.closest("[data-note-edit]");
    if (ed) {
      const key = ed.dataset.noteEdit, box = ed.closest(".note");
      box.innerHTML = `<textarea class="ninput" rows="4" placeholder="自分用のメモ（ほかの人には見えません）">${esc(state.notes[key] || "")}</textarea>
        <div class="nacts"><button type="button" class="btn small" data-note-cancel="${esc(key)}">やめる</button><button type="button" class="btn primary small" data-note-save="${esc(key)}">保存</button></div><div class="err nerr"></div>`;
      box.querySelector("textarea").focus();
      return;
    }
    const cn = e.target.closest("[data-note-cancel]");
    if (cn) { const box = cn.closest(".note"); if (box.closest("#memoNewBox")) { $("#memoNewBox").innerHTML = ""; return; } box.outerHTML = noteBlock(...splitKey(cn.dataset.noteCancel)); return; }
    const sv = e.target.closest("[data-note-save]");
    if (sv) {
      const key = sv.dataset.noteSave, box = sv.closest(".note"), text = box.querySelector("textarea").value.trim();
      sv.disabled = true;
      try {
        await window.studyNotes.set(...splitKey(key), text);
        if (text) { state.notes[key] = text; state.noteTimes[key] = new Date().toISOString(); } else { delete state.notes[key]; delete state.noteTimes[key]; }
        if (state.tab === "memo") render(); else { box.outerHTML = noteBlock(...splitKey(key)); $("#n-memo").textContent = Object.keys(state.notes).length; }
      } catch { box.querySelector(".nerr").textContent = "保存できませんでした。もう一度試してください。"; sv.disabled = false; }
    }
  });
  const splitKey = (k) => { const i = k.indexOf(":"); return [k.slice(0, i), k.slice(i + 1)]; };
  $("#bulkBtn").addEventListener("click", () => $("#bulkIn").click());
  $("#bulkIn").addEventListener("change", async (e) => {
    const list = [...e.target.files]; e.target.value = "";
    if (!list.length || !db || !window.studyFiles?.upload) return;
    const presets = window.MATERIAL_PRESETS || [];
    const st = $("#status"); let ok = 0; const ng = [];
    for (const [i, f] of list.entries()) {
      st.innerHTML = `<div class="notice">PDFを追加しています（${i + 1} / ${list.length}）：${esc(f.name)}</div>`;
      const nm = f.name.normalize("NFC");
      const pr = presets.find((p) => p.keys.some((k) => nm.includes(k)));
      const base = nm.replace(/\.pdf$/i, "");
      const docId = pr ? pr.id : slug(base);
      const prev = state.materials.find((x) => x.id === docId);
      const dm = nm.match(/(20\d{2})[-_.]?(\d{2})[-_.]?(\d{2})/);
      const body = pr ? { title: pr.title, date: pr.date, kind: pr.kind, topic: pr.topic, summary: pr.summary, tags: pr.tags, url: "", paperIds: [] }
        : { title: base, date: dm ? `${dm[1]}-${dm[2]}-${dm[3]}` : "", kind: "勉強会資料", topic: "", summary: "", tags: [], url: "", paperIds: [] };
      try {
        body.file = await window.studyFiles.upload(`${docId}.pdf`, f);
        body.fileName = f.name; body.addedAt = prev?.addedAt || new Date().toISOString();
        await db.collection("materials").doc(docId).set(body); ok++;
      } catch (err) { ng.push(f.name + (err?.code === "too_large" ? "（大きすぎます）" : "")); }
    }
    st.innerHTML = `<div class="notice">${ok}件のPDFを追加しました。${ng.length ? `追加できなかったもの：${ng.map(esc).join("、")}` : ""}</div>`;
  });
  $("#cancelBtn").addEventListener("click", closeSheet);
  $("#saveBtn").addEventListener("click", save);
  $("#delBtn").addEventListener("click", del);
  $("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  render();

  // ---------- boot ----------
  (async () => {
    const c = window.claude;
    if (!c?.use) { $("#counts").textContent = "書庫に接続できません"; return; }
    const [dbNs, userNs, sampleNs] = await Promise.all([c.use("db"), c.use("user"), c.use("sample")]);
    sample = sampleNs;
    $("#askBtn").hidden = !sample;
    $("#chat").hidden = !sample;
    renderChat();
    if (!sample) $("#searchHint").textContent = "キーワードで書庫を絞り込みます。";
    try { state.canEdit = !!(userNs && ((await userNs.canEdit()) || (await userNs.isOwner()))); } catch { state.canEdit = false; }
    $("#addBtn").hidden = !state.canEdit;
    db = dbNs;
    if (/[?&#]morning/.test(location.href)) openMorning();
    if (window.studyNotes) window.studyNotes.all().then((n) => { state.notes = n.notes; state.noteTimes = n.times; render(); }).catch(() => {});
    if (!db) { $("#counts").textContent = "書庫に接続できません"; return; }
    db.collection("books").onSnapshot((snap) => { state.books = snap.docs.map((d) => ({ id: d.id, ...d.data() })); render(); }, () => {});
    let got = { papers: false, materials: false, basics: false, summaries: false };
    for (const k of ["papers", "materials", "basics", "summaries"]) {
      db.collection(k).onSnapshot((snap) => {
        state[k] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        got[k] = true; if (got.papers && got.materials && got.basics && got.summaries) state.dbReady = true;
        render(); if (state.ai && !state.ai.loading) renderAI(); renderChat();
      }, () => { $("#status").innerHTML = `<div class="notice">書庫の読み込みが止まりました。ページを開き直してください。</div>`; });
    }
  })();
})();
</script>

<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
